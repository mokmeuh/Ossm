<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- OSSM Remote — logo principal (fond sombre) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#B39DDB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0A0A0F"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- Anneau « O » : ouvert en haut et en bas = course traversante -->
  <path d="M 199 98 A 175 175 0 0 0 199 414" fill="none" stroke="url(#g)"
        stroke-width="30" stroke-linecap="round"/>
  <path d="M 313 414 A 175 175 0 0 0 313 98" fill="none" stroke="url(#g)"
        stroke-width="30" stroke-linecap="round"/>

  <!-- Tige centrale : mouvement linéaire haut-bas -->
  <line x1="256" y1="120" x2="256" y2="392" stroke="url(#g2)"
        stroke-width="26" stroke-linecap="round"/>
  <!-- Chevrons de direction -->
  <path d="M 214 156 L 256 106 L 298 156" fill="none" stroke="url(#g2)"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 214 356 L 256 406 L 298 356" fill="none" stroke="url(#g2)"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arcs BLE : signal émis depuis l'anneau -->
  <path d="M 396 216 A 56 56 0 0 1 396 296" fill="none" stroke="#00E5FF"
        stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M 432 190 A 92 92 0 0 1 432 322" fill="none" stroke="#00E5FF"
        stroke-width="16" stroke-linecap="round" opacity="0.45"/>
</svg>
