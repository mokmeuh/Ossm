    <line x1="256" y1="120" x2="256" y2="392" stroke="url(#g2)"
          stroke-width="30" stroke-linecap="round"/>
    <path d="M 210 160 L 256 104 L 302 160" fill="none" stroke="url(#g2)"
          stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 210 352 L 256 408 L 302 352" fill="none" stroke="url(#g2)"
          stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 400 212 A 60 60 0 0 1 400 300" fill="none" stroke="#00E5FF"
          stroke-width="20" stroke-linecap="round" opacity="0.85"/>
    <path d="M 440 184 A 100 100 0 0 1 440 328" fill="none" stroke="#00E5FF"
